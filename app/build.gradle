plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 从 local.properties 读取签名密钥（不提交到 git）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('local.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.jichi.ob'
    compileSdk 36

    defaultConfig {
        applicationId "com.jichi.ob.dev"
        minSdk 26
        targetSdk 36
        versionCode 8330
        versionName "8.3.3"
        // Wahoo开发者凭证从local.properties读取（不硬编码到源码）
        buildConfigField "String", "WAHOO_CLIENT_ID", "\"${keystoreProperties['wahoo_client_id'] ?: ""}\""
        buildConfigField "String", "WAHOO_CLIENT_SECRET", "\"${keystoreProperties['wahoo_client_secret'] ?: ""}\""
        // v7.7.3-hw: 鸿蒙特别版开关（默认false=正式版走WebView登录；hw flavor=true=IGP走原生验证码登录，绕开旧WebView白屏）
        buildConfigField "boolean", "IGP_NATIVE_LOGIN", "false"
    }

    // v7.7.3-hw: 鸿蒙特别版——独立applicationId+版本名，与正式版完全隔离，只给特定华为用户测试，不发行
    flavorDimensions "edition"
    productFlavors {
        dev {
            dimension "edition"
            applicationId "com.jichi.ob.dev"
            versionCode 8330
            versionName "8.3.3"
            // v8.0.0: 移植鸿蒙特别版 iGPSPORT 原生验证码登录（WebView 登录保留为兜底）
            buildConfigField "boolean", "IGP_NATIVE_LOGIN", "true"
        }
        hw {
            dimension "edition"
            applicationId "com.jichi.ob.hw"
            versionCode 773
            versionName "7.7.3-hw"
            buildConfigField "boolean", "IGP_NATIVE_LOGIN", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '../jichi-ob-dev.keystore')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'  // v7.9.7: 轨迹合并多选列表
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'  // v7.2.0: Wahoo OAuth2直接登录需要解析HTML
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'  // v7.5.5: 后台自动同步改用WorkManager
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // v7.9.9: 解析层改用成熟开源库（Garmin 官方 FIT SDK + jpx GPX 解析），替代自研脆弱解析器
    implementation 'com.garmin:fit:21.176.0'
    implementation 'io.jenetics:jpx:3.1.0'
}
